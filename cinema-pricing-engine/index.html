<!DOCTYPE html>
<html>
<head>
    <title>Cinema Pricing Engine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h1>🎬 Cinema Pricing Engine</h1>

    <div class="card">
        <h2>Book Tickets</h2>

        <label>Seat Tier</label>
        <select id="tier">
            <option value="silver">Silver - ₹150</option>
            <option value="gold">Gold - ₹250</option>
            <option value="recliner">Recliner - ₹500</option>
        </select>

        <label>Quantity</label>
        <input type="number" id="quantity" value="1" min="1">

        <label>
            <input type="checkbox" id="member">
            Member
        </label>

        <button onclick="calculate()">Calculate Bill</button>
    </div>

    <div class="card">
        <h2>Bill</h2>

        <div id="bill">
            <p>Enter booking details.</p>
        </div>
    </div>

    <div class="card">
        <h2>Import Price List</h2>

        <textarea id="priceInput" rows="8">
Silver, ₹150
silver, 150
GOLD, ₹250.50
Gold, 250
Recliner, ₹1,200
VIP, -500
Balcony, abc
Platinum,
        </textarea>

        <button onclick="importPrices()">Import Prices</button>

        <div id="importResult"></div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
